<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgMaskGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <linearGradient id="pGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="gGradMask" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="zenGlowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo completo cuadrado para zona segura maskable -->
  <rect width="512" height="512" fill="url(#bgMaskGrad)"/>

  <!-- Contenido escalado dentro del 80% safe zone (Android maskable requirement) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <circle cx="256" cy="265" r="140" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="6 6"/>
    <circle cx="256" cy="265" r="105" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-opacity="0.45"/>

    <circle cx="256" cy="140" r="7" fill="url(#gGradMask)" filter="url(#zenGlowMask)"/>
    <path d="M256 120 L258 135 L273 137 L258 139 L256 154 L254 139 L239 137 L254 135 Z" fill="#ffffff" opacity="0.9"/>

    <g transform="translate(0, 15)" filter="url(#zenGlowMask)">
      <path d="M256 215 C210 245 160 300 195 340 C230 350 256 310 256 310 C256 310 282 350 317 340 C352 300 302 245 256 215 Z" 
            fill="url(#pGradMask)" opacity="0.75"/>
      <path d="M256 200 C225 240 185 285 215 320 C240 325 256 295 256 295 C256 295 272 325 297 320 C327 285 287 240 256 200 Z" 
            fill="url(#pGradMask)" opacity="0.9"/>
      <path d="M256 165 C240 215 235 270 256 300 C277 270 272 215 256 165 Z" 
            fill="#ffffff" opacity="0.95"/>
      <path d="M180 345 C220 375 292 375 332 345 C305 358 207 358 180 345 Z" 
            fill="url(#gGradMask)" opacity="0.85"/>
    </g>
  </g>
</svg>
