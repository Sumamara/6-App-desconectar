<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo con gradiente cósmico profundo de noche zen -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Gradiente de la onda: de la tensión (coral/ámbar) a la calma (cian/lavanda) -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="20%" stop-color="#fb923c"/>
      <stop offset="42%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="82%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Filtro de resplandor suave (Glow sutil) -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Resplandor ambiental de fondo -->
    <radialGradient id="ambientLeft" cx="30%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientRight" cx="72%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base redondeada estilo Squircle App Icon -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="118" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Iluminación ambiental difusa que refuerza la narrativa -->
  <circle cx="160" cy="256" r="140" fill="url(#ambientLeft)"/>
  <circle cx="370" cy="256" r="140" fill="url(#ambientRight)"/>

  <!-- Capa de brillo inferior (Glow de fondo) -->
  <path d="M 55,256 L 75,256 L 90,225 L 105,285 L 122,185 L 140,325 L 158,140 L 176,360 L 194,175 L 212,325 L 228,220 L 244,285 C 255,275 262,256 272,256 C 298,256 315,175 345,175 C 375,175 388,325 418,325 C 438,325 448,256 460,256"
        fill="none"
        stroke="url(#waveGrad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.32"
        filter="url(#softGlow)"/>

  <!-- Onda principal: De la tensión agitada a la curva zen -->
  <path d="M 55,256 L 75,256 L 90,225 L 105,285 L 122,185 L 140,325 L 158,140 L 176,360 L 194,175 L 212,325 L 228,220 L 244,285 C 255,275 262,256 272,256 C 298,256 315,175 345,175 C 375,175 388,325 418,325 C 438,325 448,256 460,256"
        fill="none"
        stroke="url(#waveGrad)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#softGlow)"/>

  <!-- Núcleo de luz central de la onda (le da acabado 3D/Neón refinado) -->
  <path d="M 55,256 L 75,256 L 90,225 L 105,285 L 122,185 L 140,325 L 158,140 L 176,360 L 194,175 L 212,325 L 228,220 L 244,285 C 255,275 262,256 272,256 C 298,256 315,175 345,175 C 375,175 388,325 418,325 C 438,325 448,256 460,256"
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.75"/>
</svg>
